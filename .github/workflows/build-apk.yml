name: Build & Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME=$JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "::error::JAVA_HOME is not set."
            exit 1
          fi
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java Major Version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ] || ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to detect active Java major version."
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Java version must be 17 or newer (detected: $JAVA_MAJOR)."
            exit 1
          fi
          echo "Java environment verified successfully: Java $JAVA_MAJOR detected."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Ensure gradlew is executable
        run: chmod +x gradlew || true

      - name: Create temporary debug keystore
        run: |
          mkdir -p ~/.android
          if [ -f "./debug.keystore" ]; then
            echo "Existing debug keystore found at ./debug.keystore"
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create ./debug.keystore"
            exit 1
          fi
          cp ./debug.keystore ~/.android/debug.keystore
          echo "Debug keystore configured successfully at ./debug.keystore and ~/.android/debug.keystore"

      - name: Build debug APK
        run: |
          if [ -x "./gradlew" ]; then
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: Verify the APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "::error::Expected APK not found at $TARGET_APK"
            echo "Scanning app/build/outputs/apk for available APK files:"
            find app/build/outputs/apk -name "*.apk" -ls || true
            exit 1
          fi
          if [ ! -s "$TARGET_APK" ]; then
            echo "::error::The generated APK file at $TARGET_APK is empty."
            exit 1
          fi
          if [[ "$TARGET_APK" != *.apk ]]; then
            echo "::error::File does not have a .apk extension: $TARGET_APK"
            exit 1
          fi
          echo "APK verified successfully: $(ls -lh "$TARGET_APK")"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: glass-widgets-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_RELEASE_DIR=$(mktemp -d -t apk-release-XXXXXX)
          RELEASE_ASSET_PATH="${TEMP_RELEASE_DIR}/app-debug.apk"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$RELEASE_ASSET_PATH"

          if [ ! -f "$RELEASE_ASSET_PATH" ] || [ ! -s "$RELEASE_ASSET_PATH" ]; then
            echo "::error::Failed to prepare release asset at $RELEASE_ASSET_PATH"
            exit 1
          fi

          echo "release_asset_path=${RELEASE_ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: ${RELEASE_ASSET_PATH}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.release_asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Prepared APK asset is missing or empty."
            exit 1
          fi
          if [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Asset path does not have .apk extension."
            exit 1
          fi
          ASSET_NAME=$(basename "$ASSET_PATH")
          if [ "$ASSET_NAME" != "app-debug.apk" ]; then
            echo "::error::Asset name is not app-debug.apk (found: $ASSET_NAME)"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          RELEASE_NOTES=$(cat <<EOF
          ### Automatic Debug APK Build #${{ github.run_number }}

          - **Build Type:** Automatically generated debug APK
          - **Builder:** GitHub Actions
          - **Run Number:** ${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit:** ${{ github.sha }}
          - **Notice:** This APK is signed with a temporary debug keystore and is intended for testing. It is not a production release.

          #### Direct Download
          Download **\`app-debug.apk\`** below and install on your device.
          EOF
          )

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "## 📱 Debug APK Build Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Repository:** \`${{ github.repository }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Run Number:** \`${{ github.run_number }}\` (Attempt \`${{ github.run_attempt }}\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            echo "### DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "[Download app-debug.apk](https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Asset Filename:** \`app-debug.apk\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Tag:** \`${RELEASE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Artifact:** \`glass-widgets-debug-apk\` uploaded to GitHub Actions artifacts." >> "$GITHUB_STEP_SUMMARY"
            
            echo "--- Release Details ---"
            gh release view "$RELEASE_TAG" --json tagName,title,url,assets || true
          else
            echo "### ⚠️ Release Publishing Warning" >> "$GITHUB_STEP_SUMMARY"
            echo "GitHub Release creation was not completed. If the build step succeeded, the backup artifact \`glass-widgets-debug-apk\` remains fully available in GitHub Actions summary." >> "$GITHUB_STEP_SUMMARY"
          fi
