<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background deep obsidian gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a29"/>
      <stop offset="50%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>

    <!-- Translucent front glass tile -->
    <linearGradient id="glassTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Refraction sheen -->
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft glow blur filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="508" height="508" rx="126" stroke="#ffffff" stroke-opacity="0.1" stroke-width="3"/>

  <!-- Back Layer Widget Tile (Subtle depth) -->
  <rect x="156" y="96" width="220" height="220" rx="48" fill="#1e2738" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" transform="rotate(8 266 206)"/>

  <!-- Front Hero Glass Widget Tile -->
  <rect x="116" y="156" width="240" height="240" rx="56" fill="url(#glassTile)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="3"/>
  <rect x="118" y="158" width="236" height="236" rx="54" stroke="url(#sheenGrad)" stroke-width="2"/>

  <!-- Floating Photo Window & Mountain Geometry Symbol -->
  <g transform="translate(148, 188)">
    <!-- Photo Frame Cutout -->
    <rect width="176" height="176" rx="36" fill="#0c121d" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
    
    <!-- Sun / Aperture Orb (Restrained icy blue) -->
    <circle cx="126" cy="56" r="14" fill="#e0f2fe" opacity="0.95"/>
    <circle cx="126" cy="56" r="18" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5"/>

    <!-- Layered Geometric Mountain Silhouettes -->
    <path d="M24,136 L68,82 C72,77 78,77 82,82 L120,136 Z" fill="#94a3b8" opacity="0.85"/>
    <path d="M80,136 L112,98 C116,93 122,93 126,98 L152,136 Z" fill="#cbd5e1" opacity="0.95"/>
  </g>

  <!-- Corner Specular Highlight Glint -->
  <circle cx="146" cy="186" r="3" fill="#ffffff" opacity="0.8"/>
  <path d="M142,186 H150 M146,182 V190" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>
